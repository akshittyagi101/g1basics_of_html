<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <h1>University registration Form</h1>
    <p>Please fill out the form below to register</p>
    <hr>
    <h2>Personal Details</h2>

    <form>
      <label for="name">First name:</label>
      <input type="text" required ="name" id="name" placeholder="eg: Rohan"><br><br>

      <label for="name1">Last name:</label>
      <input type="text" name="name" id="name1" placeholder="eg: Sharma"><br><br>

      <label for="Dob">Dob:</label>
      <input type="date" name="Dob" id="Dob"><br><br>

      <label for="Male">Male</label>
      <input type="radio" name="Gender" id="Male" value="Male"><br>
      <label for="Female">Female</label>
      <input type="radio" name="Gender" id="Female" value="Female"><br>
      <label for="Other">Other</label>
      <input type="radio" name="Gender" id="Other" value="Other"><br><br>

      <label>Upload your Photo</label><br>
      <input type="file"><br><br>
      <hr>

      <h2>Contact Information</h2>
      <label for="Email Address">Email Address:</label>
      <input type="email" name="Email Address" id="Email Address"><br><br>

      <label for="Phone Number">Phone Number:</label>
      <input type="tel" name="Phone Number" id="Phone Number"><br><br>

      <label for="Mailing Address">Mailing Address:</label><br>
      <textarea name="Mailing Address" id="Mailing Address" rows="5px" cols="20px"></textarea>
      <hr>

      <h2>Acadmec Information</h2>

      <label for="Select Course">Select Course:</label><br>
      <select name="Select Course" id="Select Course">
        <option value="Btech">Btech</option>
        <option value="Btech cse">Btech cse</option>
        <option value="Btech mecganical">Btech mecganical</option>
        <option value="Btech civil">Btech civil</option>
      </select><br><br>

      <label>ExtraCurricular Activity:</label><br>
      <label for="Sport">Sports</label>
      <input type="radio" name="Gender" id="Sport" value="sports"><br>
      <label for="Music">music</label>
      <input type="radio" name="Gender" id="Music" value="Music"><br>
      <label for="Others">Other</label>
      <input type="radio" name="Gender" id="Others" value="Other"><br><br>

      <hr>

      <h2>Create Your Account</h2>

      <label for="password">Create your password:</label>
      <input type="password" name="password" id="password"><br><br>

      <input type="checkbox" name="condition" id="condition" value="condition">
      <label for="condition">I agree to the term and condition</label><br><br>

      <hr>
      
      <button type="Register">Register</button>
      <button type="Clear Form">Clear Form</button>

    </form>

  </body>

</html>
