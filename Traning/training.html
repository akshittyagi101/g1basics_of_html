<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<style> 
 
 body {
 background-color: rgb(104, 112, 106);
  height: 100vh;
  margin: 0;
  display: flex;
  justify-content: center;   
  align-items: center;       
  font-family: Arial, sans-serif;
 }

 .container {
  width: 250px;
  background-color: rgb(235, 231, 231);
  border-radius: 15px;
  padding: 15px;
}

.image-box{
  display: flex;
  justify-content: center;
  align-items: center;
    /* margin: 7px; */
    padding: 7px;
}

img{
    height: 200px;
    max-width: 250px;
    width: 100%;
    border-radius: 8px;
}

button{
  background-color: goldenrod;
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  border-radius: 8px;
  border: none;
  padding: 8px;
  font-weight: bold;
  font-size: 16px;
}

</style>

<body>
<div class="container">

  <div class="image-box">
    <img src="https://media.wired.com/photos/699f9b449a2fcd92eddb5b3f/master/w_1600%2Cc_limit/AirPods%2520Max%2520Blue%2520USB-C.png" alt="HeadPhone image" >
  </div>

  <div class="content">
    <h2>Wireless Headphones</h2>
    <p class="rating">⭐⭐⭐⭐☆ (4.2) | 1.2K reviews</p>
    <p class="desc">
      Premium wireless headphones with clear sound,
      long battery life and comfortable design.
    </p>
     
  </div>

  <div class="button">
   <button type="button">Add to Cart</button>
  </div>

</div>

</body>

</html>
